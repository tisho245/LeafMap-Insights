<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Вход — LeafMap Insights</title>
  <link rel="icon" href="logo.png" type="image/png" sizes="32x32">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="auth.css" />
</head>

<body data-page="login">
  <div class="bg-leaf-canvas" aria-hidden="true"></div>

  <header class="header">
    <div class="header-inner">
      <h1 class="logo">
        <a href="index.html" class="logo-link" aria-label="LeafMap Insights - Начало">
          <img src="logo.png" alt="LeafMap Insights" class="logo-img" />
        </a>
      </h1>

      <button class="burger" id="btnBurger" type="button"
              aria-label="Отвори меню" aria-expanded="false" aria-controls="siteNav">
        <span></span><span></span><span></span>
      </button>

      <nav class="nav" id="siteNav" aria-label="Основна навигация">
        <div class="nav-mobile-head">
          <span class="nav-mobile-title">Меню</span>
          <button type="button" class="nav-close" id="btnNavClose" aria-label="Затвори меню">✕</button>
        </div>

        <a href="index.html" class="nav-link nav-btn">Начало</a>
        <a href="trees.html" class="nav-link nav-btn">Дървета</a>
        <a href="taxonomy.html" class="nav-link nav-btn">Таксономия</a>

        <a href="add-tree.html" class="nav-link nav-btn nav-btn-accent" id="addTreeLink" hidden>Добави дърво</a>

        <span class="nav-auth">
          <a href="login.html" class="btn btn-ghost" id="btnLogin">Вход</a>
          <a href="register.html" class="btn btn-ghost" id="btnRegister">Регистрация</a>
          <a href="admin.html" class="btn btn-ghost" id="adminLink" hidden>Админ</a>
          <button type="button" class="btn btn-ghost" id="btnLogout" hidden>Изход</button>
        </span>
      </nav>
    </div>
  </header>

  <div class="nav-overlay" id="navOverlay" hidden></div>

  <main class="main">
    <section class="auth-shell">
      <div class="auth-card">
        <div class="auth-head">
          <div class="auth-kicker">Добре дошли</div>
          <h2 class="auth-title">Вход</h2>
          <p class="auth-subtitle">Влез, за да добавяш дървета и да управляваш записи.</p>
        </div>

        <form id="formLogin" class="auth-form" novalidate>
          <div class="form-row">
            <label for="loginUsername">Потребителско име</label>
            <input type="text" id="loginUsername" required placeholder="Потребителско име" autocomplete="username">
          </div>

          <div class="form-row">
            <label for="loginPassword">Парола</label>
            <input type="password" id="loginPassword" required autocomplete="current-password" placeholder="••••••••">
          </div>

          <div id="loginError" class="error-msg" hidden role="alert"></div>

          <button type="submit" class="btn btn-primary btn-block">Вход</button>

          <p class="auth-switch">Нямате акаунт? <a href="register.html">Регистрация</a></p>
        </form>
      </div>
    </section>
  </main>

  <footer class="footer"><p>LeafMap Insights</p></footer>

  <script src="https://cdn.jsdelivr.net/npm/axios@1.6/dist/axios.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
