<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админ – Потребители — LeafMap Insights</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="admin">
  <header class="header">
    <div class="header-inner">
      <h1 class="logo"><a href="index.html" class="logo-link">LeafMap Insights</a></h1>
      <p class="tagline">Каталогизиране на дървета на карта</p>
      <nav class="nav">
        <a href="index.html" class="nav-link nav-btn">Начало</a>
        <a href="trees.html" class="nav-link nav-btn">Дървета</a>
        <a href="taxonomy.html" class="nav-link nav-btn">Таксономия</a>
        <a href="add-tree.html" class="nav-link nav-btn">Добави дърво</a>
        <span class="nav-auth">
          <span id="userEmail" class="user-email"></span>
          <a href="login.html" class="btn btn-ghost" id="btnLogin">Вход</a>
          <a href="admin.html" class="btn btn-ghost" id="adminLink" hidden>Админ</a>
          <button type="button" class="btn btn-ghost" id="btnLogout" hidden>Изход</button>
        </span>
      </nav>
    </div>
  </header>

  <main class="main">
    <h2 class="view-title">Админ – Потребители</h2>
    <div id="usersLoading" class="loading">Зареждане...</div>
    <div id="usersError" class="error-msg" hidden></div>
    <div id="usersList" class="cards" style="display: none;"></div>
  </main>

  <footer class="footer">
    <p>LeafMap Insights — Node.js клиент. Админ панелът е достъпен само за потребители с роля Admin.</p>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/axios@1.6/dist/axios.min.js"></script>
  <script src="app.js"></script>
  <script>
    (function() {
      async function loadUsers() {
        const loadingEl = document.getElementById('usersLoading');
        const errorEl = document.getElementById('usersError');
        const listEl = document.getElementById('usersList');
        if (!listEl) return;
        loadingEl.hidden = false;
        errorEl.hidden = true;
        listEl.style.display = 'none';
        listEl.innerHTML = '';
        try {
          const data = await authApi('api/users');
          loadingEl.hidden = true;
          const users = Array.isArray(data) ? data : [];
          if (users.length === 0) {
            listEl.innerHTML = '<p class="empty">Няма потребители.</p>';
          } else {
            listEl.innerHTML = users.map(function(u) {
              var roles = (u.roles && u.roles.length) ? u.roles.join(', ') : '—';
              return '<article class="card"><div class="card-body"><h3 class="card-title">' + (typeof escapeHtml === 'function' ? escapeHtml(u.email || u.Id) : (u.email || u.Id)) + '</h3><p class="card-meta">Роли: ' + (typeof escapeHtml === 'function' ? escapeHtml(roles) : roles) + '</p></div></article>';
            }).join('');
          }
          listEl.style.display = 'block';
        } catch (e) {
          loadingEl.hidden = true;
          errorEl.textContent = (e.status === 403 || e.status === 401) ? 'Нямате права за админ. Влезте като администратор.' : (e.message || 'Грешка при зареждане.');
          errorEl.hidden = false;
        }
      }
      document.addEventListener('DOMContentLoaded', function() {
        if (typeof updateAuthUI === 'function') updateAuthUI();
        loadUsers();
      });
    })();
  </script>
</body>
</html>
